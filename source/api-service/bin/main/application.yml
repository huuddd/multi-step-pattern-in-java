spring:
  application:
    name: fraud-detection-gateway

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fraud}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.fraud: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Thread pool configuration for Variant B
thread-pool:
  model-scoring:
    core-size: ${THREAD_POOL_CORE_SIZE:#{T(java.lang.Runtime).getRuntime().availableProcessors()}}
    max-size: ${THREAD_POOL_MAX_SIZE:#{T(java.lang.Runtime).getRuntime().availableProcessors() * 2}}
    queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY:500}
    keep-alive-seconds: ${THREAD_POOL_KEEP_ALIVE:60}
